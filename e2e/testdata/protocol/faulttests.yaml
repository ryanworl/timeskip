# expect: 0. Faults hit the containers that hold test commands too, as in
# Antithesis. A stop or kill of workload kills the drivers running there:
# they count as killed, not failed (drivers launched after its restart see
# what they left), and that timeline runs no finally_ command, since not
# every driver completed.
# (Seeds whose timelines all draw node faults: see README.md, Mixing.)
# args: --timelines 4 --seed 11
x-timeskip:
  faults: high_availability
  fault_gap: 1
  drivers: 40
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d /runs
        cat /proc/sys/kernel/random/uuid > /boot
        cat > $$d/helper_assert <<'X'
        assert() { echo "{\"antithesis_assert\": {\"id\": \"$$2\", \"message\": \"$$2\", \"assert_type\": \"$$1\", \"display_type\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": $$5}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        X
        cat > $$d/parallel_driver_sleep <<'X'
        #!/bin/sh
        . /opt/antithesis/test/v1/t/helper_assert
        b=$$(cat /boot)
        touch /runs/$$b.$$$$
        for f in /runs/*; do
          case $$f in /runs/$$b.*) ;; *) assert sometimes "a driver saw one that a fault killed" Sometimes true true; break ;; esac
        done
        sleep 2
        rm /runs/$$b.$$$$
        X
        cat > $$d/finally_check <<'X'
        #!/bin/sh
        . /opt/antithesis/test/v1/t/helper_assert
        assert always "no finally_ after a fault killed a driver" AlwaysOrUnreachable $$([ -z "$$(ls /runs)" ] && echo true || echo false) false
        X
        chmod +x $$d/parallel_driver_sleep $$d/finally_check
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
