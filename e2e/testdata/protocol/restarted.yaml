# expect: 125. A service that crashes (exits 1) once during setup, and is
# restarted (restart: on-failure) before setup completes.
services:
  flaky:
    image: busybox:1.36
    command: [sh, -c, "[ -f /crashed ] || { sleep 11.5; touch /crashed; exit 1; }; exec sleep 2147483647"]
    restart: on-failure
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\n' > $$d/singleton_driver_x && chmod +x $$d/singleton_driver_x
        sleep 14
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
