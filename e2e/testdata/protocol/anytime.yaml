# expect: 1. A template of only anytime_ commands runs them (this one exits 3).
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nexit 3\n' > $$d/anytime_x && chmod +x $$d/anytime_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
