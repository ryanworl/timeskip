# expect: 0. Compose networks as on a Docker host: a service reaches
# another on its network by name, and not one on another network (by
# address: names only resolve within a network); a published port is on
# the VM's own addresses (here the network's gateway), as Testcontainers
# uses them.
services:
  near:
    image: busybox:1.36
    command: ["nc", "-lk", "-p", "80", "-e", "echo", "hi"]
    networks: [one]
    ports: ["8080:80"]
  far:
    image: busybox:1.36
    command: ["nc", "-lk", "-p", "80", "-e", "echo", "hi"]
    networks: {two: {ipv4_address: 10.99.2.5}}
  workload:
    image: busybox:1.36
    networks: [one]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        { echo '#!/bin/sh'
          echo 'set -x'
          echo '[ "$$(nc -w 2 near 80 </dev/null)" = hi ] && ! nc -w 2 10.99.2.5 80 </dev/null &&'
          echo '[ "$$(nc -w 2 $$(ip route | awk "/default/ {print \$$3}") 8080 </dev/null)" = hi ]'
        } > $$d/singleton_driver_networks
        chmod +x $$d/singleton_driver_networks
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
networks:
  one: {}
  two: {ipam: {config: [{subnet: 10.99.2.0/24}]}}
