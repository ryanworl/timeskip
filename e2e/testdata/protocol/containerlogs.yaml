# expect: 1. A failed timeline keeps its containers' logs: stdout and
# stderr, from setup on, timed in guest time since the timeline started,
# which clock skips don't move: the ticker's lines are as far apart as the
# uptime they print, though the wall clock they print jumps.
# args: --timelines 1 --seed 1
# fails: fails at the end
x-timeskip:
  faults: resilient
  fault_gap: 3
services:
  ticker:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,disk"}
    command:
      - sh
      - -c
      - |
        echo "ticker starts" >&2
        while :; do read -r up _ </proc/uptime; echo "tick $$up $$(date +%s)"; sleep 1; done
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_x <<'X'
        #!/bin/sh
        sleep 30
        echo '{"antithesis_assert": {"assert_type": "always", "display_type": "Always", "message": "fails at the end", "condition": false, "hit": true, "must_hit": true}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        X
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
