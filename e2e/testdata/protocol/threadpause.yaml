# expect: 0. Thread pausing: as in Antithesis, every fault level (legacy
# too) pauses the threads in every container now and then, in those that
# exclusions spare from other faults too; but not timeskip's own
# processes, in the VM's root cgroup, nor while ANTITHESIS_STOP_FAULTS has
# stopped the faults. A tight pipeline in workload (excluded, and legacy
# makes no clock skips or CPU modulation, so no other fault disturbs it)
# never leaves the CPU idle by itself: the idle time while it runs is time
# its threads were paused, skipped. (Unlike gaps between its lines, which
# it counts too, it doesn't count the host's scheduling of the VM.) Much
# in the container; next to none moved to the root cgroup, or in the
# container while the faults are stopped.
# args: --timelines 2 --seed 1
x-timeskip:
  faults: legacy
services:
  workload:
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,clock,disk"}
    image: busybox:1.36
    privileged: true
    cgroup: host
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/helper_pipeline <<'X'
        assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        # pipeline: the CPU's idle ms while a tight pipeline runs, and how
        # many times 5 ms or more passed between consecutive lines
        pipeline() {
          i=$$(cut -d' ' -f2 /proc/uptime)
          g=$$(yes | ts -i %.s | head -n 1000000 | awk '$$1 >= 0.005 { n++ } END { print n + 0 }')
          echo "$$(awk -v a=$$i -v b=$$(cut -d' ' -f2 /proc/uptime) 'BEGIN { print int((b - a) * 1000) }') $$g"
        }
        X
        cat > $$d/singleton_driver_pipeline <<'X'
        #!/bin/sh
        . /opt/antithesis/test/v1/t/helper_pipeline
        set -- $$(pipeline) $$(sh -c '. /opt/antithesis/test/v1/t/helper_pipeline && echo 0 > /sys/fs/cgroup/cgroup.procs && pipeline')
        "$$ANTITHESIS_STOP_FAULTS" 60
        set -- "$$@" $$(pipeline)
        echo "idle ms (gaps of 5 ms or more): $$1 ($$2) in the container, $$3 ($$4) in the root cgroup, $$5 ($$6) with the faults stopped"
        assert sometimes Sometimes "threads in a container were paused" $$([ "$$1" -ge 100 ] && echo true || echo false)
        assert always Always "processes in the root cgroup weren't paused" $$([ "$$3" -le 30 ] && echo true || echo false)
        assert always Always "no thread was paused while the faults were stopped" $$([ "$$5" -le 30 ] && echo true || echo false)
        X
        chmod +x $$d/singleton_driver_pipeline
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
