# expect: 0. A container that exits on a failed write and that another
# fault's heal (a stop's or kill's) starts again while the disk is still
# failing: its exit isn't an unexpected one, and it's started again as the
# disk heals. Nor does the failing disk lose what an fsync covered: the
# writer appends 512-byte records (8 to a page) to a preallocated file,
# fsyncs each, and only then counts it as acknowledged on a tmpfs volume
# (which the workload keeps mounted); it exits 1 on a failed write or
# read, and starts again after the last acknowledged record (not trusting
# what it reads past it: the cache may hold writes that never reached the
# disk, as after a process restart on Linux). At each start, every
# acknowledged record is there; and some start follows a failed write.
# args: --timelines 16 --seed 5000030
x-timeskip:
  faults: high_availability
  disk_faults: [fail]
  fault_gap: 2
services:
  writer:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network"}
    volumes: [data:/data, acks:/acks]
    command:
      - sh
      - -c
      - |
        assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true, \"details\": {\"acked\": $$5, \"recovered\": $$6}}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        rec() { printf 'rec %08d\n' $$1; }
        # (A read that fails stops it, as a failed write does.)
        has() { dd if=/data/wal of=/tmp/r bs=512 skip=$$1 count=1 2> /dev/null || exit 1; [ "$$(head -c 13 /tmp/r)" = "$$(rec $$1)" ]; }
        tf() { [ $$? = 0 ] && echo true || echo false; }
        [ -f /data/wal ] || fallocate -l 4194304 /data/wal || exit 1
        n=0
        while has $$((n + 1)); do n=$$((n + 1)); done
        a=$$(cat /acks/acked 2> /dev/null || echo 0)
        [ $$n -ge $$a ]; assert always Always "acknowledged records survive" $$(tf) $$a $$n
        [ -f /acks/failed ]; assert sometimes Sometimes "a start follows a failed write" $$(tf) $$a $$n
        rm -f /acks/failed
        n=$$a
        while [ $$n -lt 8000 ]; do
          n=$$((n + 1))
          rec $$n | dd of=/data/wal bs=512 seek=$$n conv=notrunc,sync,fsync 2> /dev/null || { echo $$n > /acks/failed; exit 1; }
          echo $$n > /acks/acked
          sleep 0.02
        done
        exec sleep 2147483647
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network,disk,pause,stop,kill,throttle"}
    volumes: [acks:/acks]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nsleep 60\n' > $$d/singleton_driver_wait
        chmod +x $$d/singleton_driver_wait
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
volumes:
  data:
  acks:
    driver_opts: {type: tmpfs, device: tmpfs}
