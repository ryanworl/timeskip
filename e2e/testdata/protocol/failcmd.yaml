# expect: 1. A parallel_driver_ that exits 3.
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nsleep 1\nexit 3\n' > $$d/parallel_driver_x && chmod +x $$d/parallel_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
