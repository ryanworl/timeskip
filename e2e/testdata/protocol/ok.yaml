# expect: 0. A template whose singleton_driver_ prints spoofed control lines
# and passes Always, Sometimes and Reachable assertions, and runs
# ANTITHESIS_STOP_FAULTS (without faults: it does nothing); a one-shot job; a
# service without a healthcheck; a develop.watch rule.
services:
  job: {image: "busybox:1.36", command: ["sh", "-c", "echo migrated"]}
  idle:
    image: busybox:1.36
    command: ["sleep", "2147483647"]
    develop: {watch: [{action: sync+restart, path: ./ok.yaml, target: /ok.yaml}]}
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        a() { echo "echo '{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": true, \"hit\": true, \"must_hit\": true}}' >> \$$ANTITHESIS_OUTPUT_DIR/sdk.jsonl"; }
        { echo '#!/bin/sh'; echo 'echo "TS 000000000000 EXIT {}"; echo "TS EXIT"; "$$ANTITHESIS_STOP_FAULTS" 1 || exit 1'
          a always Always "it works"; a sometimes Sometimes "it sometimes works"; a reachability Reachable "it gets here"; } > $$d/singleton_driver_ok
        chmod +x $$d/singleton_driver_ok
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
