# expect: 0. With resilient faults (slowed or jammed clogs; the labels
# spare the nodes pauses), a client pings a server five times a second for
# 66 s; at 60 s it stops the faults, which heals a jam in effect. A reply
# that comes back 5 s or more after its request was held by a jam (a slowed
# link adds at most 2 s each way): jams hold packets and deliver them, all
# together, once healed. The client's kernel gets a reply to every request
# (the baseline loss, at most 0.05%, may take one or two), though ping's
# socket can't take a long jam's replies all at once.
# args: --timelines 4 --seed 1
x-timeskip:
  faults: resilient
services:
  server:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "pause,stop,kill"}
    command: [sleep, "2147483647"]
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "pause,stop,kill"}
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_ping <<'X'
        #!/bin/sh
        assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        echos() { awk '/^Icmp:/ { if (!h) { for (i = 2; i <= NF; i++) f[$$i] = i; h = 1 } else print $$f["OutEchos"] - $$f["InEchoReps"] }' /proc/net/snmp; }
        unanswered=$$(echos)
        ping -i 0.2 -w 66 server > /tmp/ping &
        sleep 60
        "$$ANTITHESIS_STOP_FAULTS" 60
        wait
        sleep 1
        unanswered=$$(($$(echos) - unanswered))
        # Of the replies held 5 s or more, how many, and how far apart those
        # of a jam arrived (their requests sent every 200 ms).
        set -- $$(awk '
          / bytes from / {
            s = t = -1
            for (i = 1; i <= NF; i++) { if ($$i ~ /^seq=/) s = substr($$i, 5) + 0; if ($$i ~ /^time=/) t = substr($$i, 6) + 0 }
            if (s >= 0 && !(s in rtt)) rtt[s] = t
            if (s > last) last = s
          }
          END {
            for (s = 0; s <= last; s++) {
              if (!(s in rtt)) continue
              if (rtt[s] < 5000) { run = 0; continue }
              at = s * 200 + rtt[s]
              if (!run) { run = 1; lo = hi = at }
              if (at < lo) lo = at
              if (at > hi) hi = at
              held++
              if (hi - lo > spread) spread = hi - lo
            }
            print held + 0, int(spread)
          }' /tmp/ping)
        echo "$$1 replies held 5 s or more, a jam's arriving within $$2 ms; $$unanswered requests unanswered"
        assert sometimes Sometimes "a jam held a ping 5 s or more, then delivered it" $$([ $$1 -gt 0 ] && echo true || echo false)
        assert always Always "the pings a jam held arrive together, once it's healed" $$([ $$2 -le 500 ] && echo true || echo false)
        assert always Always "a jam delivers what it held" $$([ $$unanswered -le 2 ] && echo true || echo false)
        X
        chmod +x $$d/singleton_driver_ping
        until ping -c 1 -W 1 server > /dev/null; do sleep 0.2; done
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
