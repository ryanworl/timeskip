# expect: 0. Node faults race containers that exit by themselves: a service
# exits 0 every 0.1 to 1 s and its restart policy starts it again, so pauses,
# stops and kills often pick it as it's exiting, stopped or restarting. Docker
# refusing to pause, unpause, stop or kill it then isn't an error: the
# fault has nothing to do there.
# args: --timelines 64 --seed 1
x-timeskip:
  faults: high_availability
  fault_gap: 1
services:
  flappy:
    image: busybox:1.36
    restart: always
    command: [sh, -c, "sleep 0.$$((RANDOM % 9 + 1))"]
  workload:
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,clock,disk"}
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nsleep 30\n' > $$d/singleton_driver_wait
        chmod +x $$d/singleton_driver_wait
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
