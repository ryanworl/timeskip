# expect: 1. A crash that races node faults still counts: racer crashes
# (exits 1) once, soon after the driver starts, and its restart policy
# would start it again after 100 ms, while stops and kills come every few
# ms. As its process doesn't catch SIGTERM (faultcrash.yaml's does), only a
# 137 or 143 exit can be a stop's or a kill's, whenever the crash comes:
# before the signal, while a stop waits out its timeout, or as Docker is
# restarting it. Right before it exits 1, racer reaches "racer exits 1",
# and e2e_test.go checks that exactly the timelines that reached it failed,
# with the crash. (A kill can beat the crash: then the timeline has none.
# The driver runs on until racer has restarted after it, so that Docker has
# reported the exit, and 1 s more.)
# errors: (containers: \S*racer\S* exited with code 1)?
# args: --timelines 32 --seed 1
x-timeskip:
  faults: high_availability
  fault_gap: 0.2
services:
  racer:
    image: busybox:1.36
    restart: on-failure
    volumes: [shared:/shared]
    command:
      - sh
      - -c
      - |
        until [ -f /shared/go ]; do sleep 0.01; done
        if [ ! -f /crashed ]; then
          sleep 0.0$$((RANDOM % 10))
          # (Builtins from here: a kill between "racer exits 1" and the exit is unlikely.)
          : > /crashed; : > /shared/crashed
          echo '{"antithesis_assert": {"assert_type": "reachable", "display_type": "Reachable", "message": "racer exits 1", "condition": true, "hit": true, "must_hit": false}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
          exit 1
        fi
        : > /shared/restarted
        sleep 2147483647 & wait
  workload:
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,clock,disk"}
    image: busybox:1.36
    volumes: [shared:/shared]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\ntouch /shared/go; for f in crashed restarted; do i=0; until [ -f /shared/$$f ] || [ $$i -ge 400 ]; do sleep 0.05; i=$$((i+1)); done; done; sleep 1\n' > $$d/singleton_driver_x
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
volumes: {shared: {}}
