# expect: 0. A stop that comes as a container's process execs another
# program doesn't count its exit: chain's PID 1 execs, every 2 ms or so,
# from a sh that doesn't catch SIGTERM (as PID 1 it ignores it, so a stop
# then ends in SIGKILL, 137) to one that catches it and exits 3, and back,
# as an entrypoint execs its server (bash, then gosu, then java). The
# container is frozen from before timeskip reads how its process takes
# the stop signal until Docker has sent it, so the process that takes it
# is the one read. initchain does the same under Docker's init (init:
# true), which forwards the signal to its child only after the freeze
# (its child dies of SIGTERM, 143, or catches it and exits 3, and init
# with it), so any exit after the signal counts as the stop's there. The
# driver runs until node faults have started each again 6 times (or
# 120 s).
# (Seeds whose timelines all draw node faults: see README.md, Mixing.)
# args: --timelines 4 --seed 14
volumes: {shared: {}}
x-timeskip:
  faults: high_availability
  fault_gap: 1
services:
  chain:
    image: busybox:1.36
    volumes: [shared:/shared]
    command: [sh, -c, "echo boot >> /shared/chain; echo 'sleep 0.002; exec sh /tmp/b' > /tmp/a; echo \"trap 'exit 3' TERM; sleep 0.002; exec sh /tmp/a\" > /tmp/b; exec sh /tmp/a"]
  initchain:
    image: busybox:1.36
    init: true
    volumes: [shared:/shared]
    command: [sh, -c, "echo boot >> /shared/initchain; echo 'sleep 0.002; exec sh /tmp/b' > /tmp/a; echo \"trap 'exit 3' TERM; sleep 0.002; exec sh /tmp/a\" > /tmp/b; exec sh /tmp/a"]
  workload:
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,clock,disk"}
    image: busybox:1.36
    volumes: [shared:/shared]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_x <<'X'
        #!/bin/sh
        i=0; until [ $$(wc -l < /shared/chain) -ge 7 ] && [ $$(wc -l < /shared/initchain) -ge 7 ] || [ $$i -ge 600 ]; do sleep 0.2; i=$$((i + 1)); done
        X
        chmod +x $$d/singleton_driver_x
        until [ -s /shared/chain ] && [ -s /shared/initchain ]; do sleep 0.2; done
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
