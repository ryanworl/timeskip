# expect: 0. The mixture: some timelines make node faults and some don't,
# as their seeds draw; those that don't make no pause, stop, kill or
# throttle of a node, and their network faults come three times as close;
# and each timeline draws its own gap, from a third of --fault-gap's to
# three times it.
# args: --timelines 8 --seed 40
x-timeskip:
  faults: high_availability
  fault_gap: 3
services:
  server:
    image: busybox:1.36
    command: [sh, -c, "mkdir -p /www && echo ok > /www/x && exec httpd -f -p 8080 -h /www"]
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "pause,stop,kill,throttle"}
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_wait <<'X'
        #!/bin/sh
        for i in $$(seq 40); do wget -q -T 1 -O /dev/null http://server:8080/x; sleep 1; done
        X
        chmod +x $$d/singleton_driver_wait
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
