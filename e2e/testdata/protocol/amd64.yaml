# expect: 0. linux/amd64 images, the only ones Antithesis runs, run on any
# host: on arm64, emulated. One service asks for linux/amd64 (platform:);
# the other's image has only a linux/amd64 variant. Both, and a test command,
# run x86_64 code.
services:
  pinned:
    image: alpine:3.20
    platform: linux/amd64
    command:
      - sh
      - -c
      - |
        echo "{\"antithesis_assert\": {\"id\": \"pinned runs x86_64\", \"message\": \"pinned runs x86_64\", \"assert_type\": \"always\", \"display_type\": \"Always\", \"condition\": $$([ $$(uname -m) = x86_64 ] && echo true || echo false), \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
  workload:
    image: amd64/busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_arch <<'X'
        #!/bin/sh
        echo "{\"antithesis_assert\": {\"id\": \"a test command runs x86_64\", \"message\": \"a test command runs x86_64\", \"assert_type\": \"always\", \"display_type\": \"Always\", \"condition\": $$([ $$(uname -m) = x86_64 ] && echo true || echo false), \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        X
        chmod +x $$d/singleton_driver_arch
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
