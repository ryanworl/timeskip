# expect: 0. Test commands run as docker exec runs them: as the service's
# user and group, with its group_add groups, in its working directory, with
# its environment and hostname, in its namespaces.
services:
  workload:
    image: busybox:1.36
    user: root:nobody
    group_add: [dialout, "1234"]
    working_dir: /tmp
    hostname: wl
    environment: {FOO: bar}
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        { echo '#!/bin/sh'
          echo 'set -x'
          echo '[ "$$(id)" = "uid=0(root) gid=65534(nobody) groups=18(dialout),1234,65534(nobody)" ] && [ "$$PWD" = /tmp ] && [ "$$FOO" = bar ] && [ "$$HOME" = /root ] &&'
          echo '[ "$$HOSTNAME" = wl ] && [ "$$(hostname)" = wl ] && grep -q sleep /proc/1/cmdline && [ -f /opt/antithesis/test/v1/t/singleton_driver_env ]'
        } > $$d/singleton_driver_env
        chmod +x $$d/singleton_driver_env
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
