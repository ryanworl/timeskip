# expect: 0. Test templates on a volume are found.
services:
  workload:
    image: busybox:1.36
    volumes: [tests:/opt/antithesis/test/v1]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nexit 0\n' > $$d/singleton_driver_x && chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
volumes:
  tests: {}
