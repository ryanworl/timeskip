# expect: 1. Every crash counts, however many: flood's sh kills itself
# with SIGSEGV 400 times in a row, about 500 KiB of the kernel's log with
# the registers it prints for each (more than its ring of 256 KiB on arm64
# or 128 KiB on x86_64), with no node faults, whose stops would read the
# log on the way. Each is one error.
# errors: crash: \S+: sh died of signal 11 \(segmentation fault\)(?:; crash: \S+: sh died of signal 11 \(segmentation fault\)){399}
# args: --timelines 2 --seed 1
x-timeskip:
  faults: none
services:
  flood:
    image: busybox:1.36
    volumes: [shared:/shared]
    command:
      - sh
      - -c
      - |
        until [ -f /shared/go ]; do sleep 0.01; done
        i=0; while [ $$i -lt 400 ]; do sh -c 'kill -SEGV $$$$'; i=$$((i + 1)); done
        : > /shared/done
        exec sleep 2147483647
  workload:
    labels: {com.antithesis.exclude_from_faults: "network,pause,stop,kill,throttle,clock,disk"}
    image: busybox:1.36
    volumes: [shared:/shared]
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\ntouch /shared/go; i=0; until [ -f /shared/done ] || [ $$i -ge 600 ]; do sleep 0.1; i=$$((i+1)); done; sleep 1\n' > $$d/singleton_driver_x
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
volumes: {shared: {}}
