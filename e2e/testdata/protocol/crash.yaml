# expect: 1. A process that dies of a program error signal (here SIGSEGV),
# as Antithesis's "No unexpected crashes" counts them, fails the timeline,
# even when the command that started it exits 0.
# errors: crash: \S.* died of signal 11 \(segmentation fault\)
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_x <<'X'
        #!/bin/sh
        sh -c 'kill -SEGV $$$$'
        exit 0
        X
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
