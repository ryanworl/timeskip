# expect: 0. --profile samples the containers' stacks every 10 ms of CPU
# time: a driver copies /dev/zero to /dev/null for 1 s of guest time, then
# sleeps 30 s, and another container only sleeps. e2e_test.go checks the
# folded stacks: a sample of dd for each 10 ms of the command's CPU time
# (about 100), in the kernel's vfs_read among others, none of the idle
# container, and the sleep still skipped.
# args: --profile
services:
  idle:
    image: busybox:1.36
    command: [sleep, "2147483647"]
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\ntimeout 1 dd if=/dev/zero of=/dev/null bs=64k 2>/dev/null\nsleep 30\n' > $$d/singleton_driver_copy
        chmod +x $$d/*
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
