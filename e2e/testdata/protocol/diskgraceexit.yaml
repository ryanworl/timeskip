# expect: 1. A disk fault claims a crash only in a container whose own
# exit it claims. exiter, on a full disk, waits until it can write again,
# spins 2 s (so the fault watches it), then exits with code 134 itself, as
# a system's script may on an error: that exit is the fault's doing, but no
# process crashed. As it does, bystander, on a node excluded from disk
# faults, runs a child sh that aborts (SIGABRT) while bystander runs on:
# that crash still counts, though exiter's 134 is SIGABRT's code and both
# run sh. (e2e_test.go checks that each timeline whose bystander's child
# aborted fails with it.)
# errors: (crash: sh: sh died of signal 6 \(aborted\))?
# args: --timelines 6 --seed 1
x-lib: &lib |
  assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
  # spin S: busy for S seconds of uptime.
  spin() { read u _ < /proc/uptime; e=$$(($${u%.*} + $$1)); while read u _ < /proc/uptime && [ $${u%.*} -lt $$e ]; do :; done; }
x-timeskip:
  faults: legacy
  disk_faults: [full]
  fault_gap: 2
services:
  exiter:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network"}
    environment: {LIB: *lib}
    volumes: [data:/data, acks:/acks]
    command:
      - sh
      - -c
      - |
        eval "$$LIB"
        while dd if=/dev/zero of=/data/f bs=64k count=4 conv=fsync 2> /dev/null; do rm /data/f; sleep 0.1; done
        until dd if=/dev/zero of=/data/f bs=4k count=1 conv=fsync 2> /dev/null; do sleep 0.1; done
        spin 2
        touch /acks/exited
        exit 134
  bystander:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network,disk"}
    environment: {LIB: *lib}
    volumes: [acks:/acks]
    command:
      - sh
      - -c
      - |
        eval "$$LIB"
        until [ -f /acks/exited ]; do sleep 0.05; done
        sh -c 'kill -ABRT $$$$'
        assert sometimes Sometimes "the bystander's child aborted" true
        exec sleep 2147483647
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network,disk,pause,stop,kill,throttle"}
    volumes: [acks:/acks]   # (it keeps the tmpfs mounted as the others restart)
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nsleep 40\n' > $$d/singleton_driver_wait
        chmod +x $$d/singleton_driver_wait
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
volumes:
  data:
  acks:
    driver_opts: {type: tmpfs, device: tmpfs}
