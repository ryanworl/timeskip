# expect: 0. --memory sets the VMs' memory.
x-timeskip:
  memory: 6
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_mem <<'X'
        #!/bin/sh
        kb=$$(awk '/^MemTotal/ { print $$2 }' /proc/meminfo)
        echo "{\"antithesis_assert\": {\"id\": \"the VM has 6 GiB\", \"message\": \"the VM has 6 GiB\", \"assert_type\": \"always\", \"display_type\": \"Always\", \"condition\": $$([ $$kb -gt 5500000 ] && [ $$kb -le 6291456 ] && echo true || echo false), \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        X
        chmod +x $$d/singleton_driver_mem
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
