# expect: 1. Every user can append to sdk.jsonl, whoever wrote it first: a
# root service writes setup_complete, then a test command appends a false
# Always assertion as nobody, ignoring errors as the Antithesis SDKs do.
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        { echo '#!/bin/sh'
          echo "setuidgid nobody sh -c 'echo \"{\\\"antithesis_assert\\\": {\\\"assert_type\\\": \\\"always\\\", \\\"display_type\\\": \\\"Always\\\", \\\"message\\\": \\\"never\\\", \\\"condition\\\": false, \\\"hit\\\": true, \\\"must_hit\\\": true}}\" >> \$$ANTITHESIS_OUTPUT_DIR/sdk.jsonl' 2>/dev/null; exit 0"
        } > $$d/singleton_driver_nobody
        chmod +x $$d/singleton_driver_nobody
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
