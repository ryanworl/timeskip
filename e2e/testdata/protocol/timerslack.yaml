# expect: 0. timer_slack sets the guest's timer slack, which every process
# inherits: the container's own process and a test command see 7 ms.
x-timeskip:
  timer_slack: 7ms
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        cat /proc/self/timerslack_ns > /slack
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_slack <<'X'
        #!/bin/sh
        ok=$$([ "$$(cat /slack)" = 7000000 ] && [ "$$(cat /proc/self/timerslack_ns)" = 7000000 ] && echo true || echo false)
        echo "{\"antithesis_assert\": {\"id\": \"timers have 7 ms of slack\", \"message\": \"timers have 7 ms of slack\", \"assert_type\": \"always\", \"display_type\": \"Always\", \"condition\": $$ok, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        X
        chmod +x $$d/singleton_driver_slack
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
