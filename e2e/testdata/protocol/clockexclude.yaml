# expect: 0. A container labeled com.antithesis.exclude_from_faults with
# "clock" turns clock skips off for the whole VM (it has one wall clock):
# with resilient faults, a command that compares the wall clock (date, in
# seconds) with /proc/uptime every 50 ms never sees it jump by 2 s or more.
# (clockskip.yaml, the same without the label, sees it jump both ways.)
# args: --timelines 2 --seed 1
x-timeskip:
  faults: resilient
  fault_gap: 3
services:
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "clock"}
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_clock <<'X'
        #!/bin/sh
        assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        ms() { read -r up _ < /proc/uptime; echo $$(($${up%.*} * 1000 + 1$${up#*.} * 10 - 1000)); }
        "$$ANTITHESIS_STOP_FAULTS" 60
        steady=true
        m0=$$(ms) w0=$$(date +%s) start=$$(ms)
        while [ $$((m0 - start)) -lt 30000 ]; do
          sleep 0.05
          m=$$(ms) w=$$(date +%s)
          dw=$$(((w - w0) * 1000 - (m - m0)))
          [ $$dw -lt 2000 ] && [ $$dw -gt -2000 ] || { steady=false; echo "the wall clock jumped by about $$dw ms"; }
          m0=$$m w0=$$w
        done
        assert always Always "the wall clock doesn't jump" $$steady
        X
        chmod +x $$d/singleton_driver_clock
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
