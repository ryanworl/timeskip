# expect: 0. An eventually_ ending kills drivers that don't end: a
# serial_driver_ (seed 4 starts one first), and parallel_driver_ ones that
# a serial_driver_ waits for (seed 5).
# args: --seed 4 --timelines 2
x-timeskip:
  timeout: 60
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nexec sleep 2147483647\n' > $$d/serial_driver_forever
        printf '#!/bin/sh\nexec sleep 2147483647\n' > $$d/parallel_driver_forever
        printf '#!/bin/sh\nexit 0\n' > $$d/eventually_ok
        chmod +x $$d/*
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
