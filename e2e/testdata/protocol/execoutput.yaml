# expect: 0. A command's output is kept whole, however slowly the console
# takes it: what it wrote before it exited isn't cut off a second after
# its exit (END 1 to END 3, written as the console takes a 1 MB line,
# which on Linux's serial console takes seconds), while what it left
# running, writing on, isn't waited for past that second.
# args: --timelines 1 --seed 1
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_x <<'X'
        #!/bin/sh
        (while :; do echo left running; sleep 0.1; done) &
        head -c 1000000 /dev/zero | tr '\0' a; echo
        sleep 0.5
        echo END 1; echo END 2; echo END 3
        X
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
