# expect: 1. A crash during a failing disk that no failed read or write
# preceded still counts: crasher does no I/O, and exits 2 as soon as a
# disk is failing (a loop device's timeskip_fail). The heal doesn't take
# the exit for the fault's, nor start it again (diskfailstop.yaml: an exit
# after failed writes is the fault's).
# errors: containers: \S*crasher\S* exited with code 2
# args: --timelines 4 --seed 1
x-timeskip:
  faults: legacy
  disk_faults: [fail]
  fault_gap: 2
services:
  crasher:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network"}
    command: [sh, -c, "while [ -z \"$$(grep -v '^0$$' /sys/block/loop*/loop/timeskip_fail)\" ]; do sleep 0.05; done; exit 2"]
  workload:
    image: busybox:1.36
    labels: {com.antithesis.exclude_from_faults: "network,disk"}
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nsleep 10\n' > $$d/singleton_driver_wait
        chmod +x $$d/singleton_driver_wait
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
