# expect: 1. A timeline that runs out of guest time: a parallel_driver_
# that never ends is killed (a killed command doesn't fail). That isn't a
# failure by itself, but with no timeline of the template that completed,
# Antithesis's "All commands were run to completion at least once" fails.
# fails: All commands were run to completion at least once
x-timeskip:
  timeout: 5
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        printf '#!/bin/sh\nexec sleep 2147483647\n' > $$d/parallel_driver_forever && chmod +x $$d/parallel_driver_forever
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
