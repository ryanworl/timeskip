# expect: 1. Files in a test template that aren't commands, as Antithesis's
# "Invalid commands found" counts them, fail every timeline: one without a
# command prefix, one that isn't executable. helper_ files and
# subdirectories are left alone, and names may have spaces (in a template
# and a command).
# errors: invalid test command: /opt/antithesis/test/v1/t/check\.sh in \S+: no test command prefix; invalid test command: /opt/antithesis/test/v1/t/parallel_driver_off in \S+: not an executable file
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1 && mkdir -p "$$d/t/sub" "$$d/my t"
        printf '#!/bin/sh\nexit 0\n' > $$d/t/singleton_driver_ok
        printf '#!/bin/sh\nexit 0\n' > "$$d/my t/singleton_driver_a b"
        printf '#!/bin/sh\nexit 0\n' > $$d/t/check.sh
        printf '#!/bin/sh\nexit 0\n' > $$d/t/helper_lib.sh
        printf '#!/bin/sh\nexit 1\n' > $$d/t/parallel_driver_off
        chmod +x $$d/t/singleton_driver_ok "$$d/my t/singleton_driver_a b" $$d/t/check.sh
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
