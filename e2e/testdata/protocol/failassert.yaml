# expect: 1. Each kind of assertion on each side of passing: an Always that
# is false, a Sometimes never true, a Reachable never reached, an
# Unreachable reached and a must_hit Always never hit fail; a Reachable
# reached and an AlwaysOrUnreachable never hit pass.
# fails: never false; never reached; reached anyway; required; sometimes true
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        a() { echo "echo '{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": $$5, \"must_hit\": $$6}}' >> \$$ANTITHESIS_OUTPUT_DIR/sdk.jsonl"; }
        { echo '#!/bin/sh'
          a always Always 'never false' false true true
          a sometimes Sometimes 'sometimes true' false true true
          a reachability Reachable 'never reached' false false true
          a reachability Reachable 'reached' true true true
          a reachability Unreachable 'reached anyway' true true false
          a always Always 'required' false false true
          a always AlwaysOrUnreachable 'optional' false false false
        } > $$d/singleton_driver_x
        chmod +x $$d/singleton_driver_x
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
