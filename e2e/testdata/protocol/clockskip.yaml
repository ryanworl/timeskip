# expect: 0. With resilient faults, clock skips step the VM's wall clock
# forward and back, and go on while ANTITHESIS_STOP_FAULTS holds the other
# faults off, while the monotonic clock runs on: a command that compares
# the wall clock (date, in seconds) with /proc/uptime every 50 ms sees it
# jump by 2 s or more both ways, while uptime never goes back nor jumps.
# args: --timelines 2 --seed 1
x-timeskip:
  faults: resilient
  fault_gap: 3
services:
  workload:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        d=/opt/antithesis/test/v1/t && mkdir -p $$d
        cat > $$d/singleton_driver_clock <<'X'
        #!/bin/sh
        assert() { echo "{\"antithesis_assert\": {\"assert_type\": \"$$1\", \"display_type\": \"$$2\", \"message\": \"$$3\", \"condition\": $$4, \"hit\": true, \"must_hit\": true}}" >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl; }
        ms() { read -r up _ < /proc/uptime; echo $$(($${up%.*} * 1000 + 1$${up#*.} * 10 - 1000)); }
        "$$ANTITHESIS_STOP_FAULTS" 60
        fwd=false back=false mono=true
        m0=$$(ms) w0=$$(date +%s) start=$$(ms)
        while [ $$((m0 - start)) -lt 30000 ]; do
          sleep 0.05
          m=$$(ms) w=$$(date +%s)
          dm=$$((m - m0)) dw=$$(((w - w0) * 1000 - (m - m0)))
          [ $$dw -ge 2000 ] && fwd=true && echo "the wall clock jumped by about $$dw ms"
          [ $$dw -le -2000 ] && back=true && echo "the wall clock jumped by about $$dw ms"
          [ $$dm -ge 0 ] && [ $$dm -lt 2000 ] || { mono=false; echo "uptime moved by $$dm ms"; }
          m0=$$m w0=$$w
        done
        assert sometimes Sometimes "the wall clock jumps forward" $$fwd
        assert sometimes Sometimes "the wall clock jumps back" $$back
        assert always Always "the monotonic clock neither goes back nor jumps" $$mono
        X
        chmod +x $$d/singleton_driver_clock
        echo '{"antithesis_setup": {"status": "complete", "details": null}}' >> $$ANTITHESIS_OUTPUT_DIR/sdk.jsonl
        exec sleep 2147483647
